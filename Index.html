
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>My Gym Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;padding:22px 16px 50px}
header,main{max-width:650px;margin:auto}
h1{font-size:29px;margin:8px 0 4px}
.sub{color:#999;margin-bottom:24px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}
.day{background:#24252a;color:#ddd;border:0;border-radius:10px;padding:13px 4px;font-weight:700}
.day.active{background:#d8ff3e;color:#111}
.card{background:#1c1d22;border:1px solid #303137;border-radius:14px;padding:15px;margin:12px 0}
h2{font-size:20px;margin:5px 0}
h3{font-size:16px;margin:0 0 6px}
.muted{color:#999;font-size:13px}
.exercise{border-top:1px solid #34353b;padding:14px 0}
.exercise:first-of-type{border-top:0}
.exhead{display:flex;align-items:flex-start;gap:10px}
input[type=checkbox]{width:21px;height:21px;accent-color:#d8ff3e;flex-shrink:0}
.exname{font-weight:650;flex:1}
.done .exname{text-decoration:line-through;color:#888}
.sets{color:#b8b8b8;font-size:13px;margin:5px 0 9px 31px}
.fields{display:flex;gap:8px;margin-left:31px}
.fields input{min-width:0;width:50%;background:#111216;color:white;border:1px solid #414249;border-radius:8px;padding:10px;font-size:14px}
.progress{height:7px;background:#34353b;border-radius:9px;overflow:hidden;margin-top:12px}
.bar{height:100%;background:#d8ff3e;width:0}
button.action{border:0;border-radius:9px;background:#d8ff3e;color:#111;font-weight:750;padding:13px 16px;width:100%;margin-top:12px;font-size:15px}
button.secondary{background:#303137;color:#eee}
.history{white-space:pre-wrap;color:#bbb;font-size:13px;line-height:1.6}
footer{text-align:center;color:#777;font-size:12px;margin:30px}
</style>
</head>
<body>
<header>
<div class="muted">YOUR PERSONAL TRAINING LOG</div>
<h1>GYM TRACKER <span style="color:#d8ff3e">.</span></h1>
<div class="sub">Build consistency. Track every session.</div>
</header>
<main>
<div class="card">
<div class="muted">WEEKLY WORKOUTS</div>
<h2 id="count">0 / 4 completed</h2>
<div class="progress"><div class="bar" id="weekbar"></div></div>
</div>
<div class="days" id="days"></div>
<section id="workout"></section>
<section class="card">
<h3>Workout history</h3>
<div class="muted">Your completed sessions</div>
<div id="history" class="history" style="margin-top:12px">No completed workouts yet.</div>
<button class="action secondary" onclick="clearHistory()">Reset workout history</button>
</section>
</main>
<footer>Your progress is saved on this device.</footer>
<script>
const plans=[
{day:"MON",name:"Chest, Back & Shoulders A",items:[
["Incline dumbbell press","3 × 8–10"],["Flat machine chest press","3 × 8–12"],["Chest-supported row","3 × 8–12"],["Lat pulldown","3 × 10–12"],["Cable lateral raises","3 × 12–15"],["Pec deck fly","2 × 12–15"]]},
{day:"TUE",name:"Arms & Abs",items:[
["Rope triceps pushdown","3 × 10–12"],["Overhead cable triceps extension","2 × 10–12"],["Dumbbell biceps curl","3 × 10–12"],["Hammer curl","2 × 10–12"],["Cable crunch","3 × 12–15"],["Hanging knee raise","3 × 10–15"]]},
{day:"THU",name:"Chest, Back & Shoulders B",items:[
["Flat dumbbell bench press","3 × 8–10"],["Incline chest press machine","3 × 10–12"],["Wide or neutral-grip lat pulldown","3 × 8–12"],["Seated cable row","3 × 10–12"],["Seated dumbbell shoulder press","2 × 8–10"],["Dumbbell lateral raises","3 × 12–15"],["Face pulls","2 × 12–15"]]},
{day:"SAT",name:"Arms, Abs & Optional Cardio",items:[
["EZ-bar or cable biceps curl","3 × 10–12"],["Rope hammer curl","2 × 10–12"],["Cable triceps pushdown","3 × 10–12"],["Overhead cable triceps extension","2 × 12–15"],["Reverse crunch","3 × 12–15"],["Side plank","2 × 30–45 sec / side"],["Optional incline treadmill walk","15–20 minutes"]]}
];
const KEY="gymTrackerV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"logs":{},"history":[]}');
let selected=0;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function logKey(d,i){return d+"-"+i}
function render(){
document.getElementById("days").innerHTML=plans.map((p,i)=>`<button class="day ${selected===i?'active':''}" onclick="selectDay(${i})">${p.day}</button>`).join("");
const p=plans[selected],logs=data.logs;
let completed=p.items.filter((x,i)=>logs[logKey(selected,i)]?.done).length;
document.getElementById("workout").innerHTML=`<div class="card"><div class="muted">${p.day} WORKOUT</div><h2>${p.name}</h2><div class="muted">${completed} of ${p.items.length} exercises completed</div><div class="progress"><div class="bar" style="width:${completed/p.items.length*100}%"></div></div>${p.items.map((x,i)=>{const v=logs[logKey(selected,i)]||{};return `<div class="exercise ${v.done?'done':''}"><div class="exhead"><input type="checkbox" ${v.done?'checked':''} onchange="toggle(${selected},${i},this.checked)"><div class="exname">${x[0]}</div></div><div class="sets">${x[1]}</div><div class="fields"><input placeholder="Weight (kg)" inputmode="decimal" value="${v.weight||''}" onchange="field(${selected},${i},'weight',this.value)"><input placeholder="Reps / notes" value="${v.reps||''}" onchange="field(${selected},${i},'reps',this.value)"></div></div>`}).join("")}<button class="action" onclick="finish()">Complete workout</button></div>`;
const done=plans.filter((p,i)=>p.items.every((x,j)=>logs[logKey(i,j)]?.done)).length;
document.getElementById("count").textContent=done+" / 4 completed";
document.getElementById("weekbar").style.width=done/4*100+"%";
document.getElementById("history").textContent=data.history.length?data.history.slice().reverse().join("\n"):"No completed workouts yet.";
}
function selectDay(i){selected=i;render()}
function toggle(d,i,v){let k=logKey(d,i);data.logs[k]=data.logs[k]||{};data.logs[k].done=v;save();render()}
function field(d,i,f,v){let k=logKey(d,i);data.logs[k]=data.logs[k]||{};data.logs[k][f]=v;save()}
function finish(){data.history.push(new Date().toLocaleDateString()+" — "+plans[selected].name);save();render();alert("Workout saved. Great work!")}
function clearHistory(){if(confirm("Clear all workout history and exercise logs?")){data={logs:{},history:[]};save();render()}}
render();
</script>
</body>
</html>
